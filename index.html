<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bolinha de Papel</title>
<meta name="description" content="Atividade em família do episódio 6 de Lia, a Menina de Papel — amasse um papel e brinque de devolver.">
</head>
<body>
<style>
  :root {
    --bg: #ebe0cb;
    --bg-deep: #ddccae;
    --card: #fbf6ec;
    --card-deep: #f1e6d2;
    --ink: #5a4034;
    --ink-soft: #8a6f5c;
    --accent: #c7483c;
    --accent-soft: #d8a3a0;
    --shadow: rgba(90, 64, 52, 0.22);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #201811; --bg-deep: #170f0a; --card: #2c2018; --card-deep: #372920;
      --ink: #f1e6d2; --ink-soft: #c9b7a3; --accent: #e17a6d; --accent-soft: #c98f86;
      --shadow: rgba(0, 0, 0, 0.55);
    }
  }
  :root[data-theme="dark"] {
    --bg: #201811; --bg-deep: #170f0a; --card: #2c2018; --card-deep: #372920;
    --ink: #f1e6d2; --ink-soft: #c9b7a3; --accent: #e17a6d; --accent-soft: #c98f86;
    --shadow: rgba(0, 0, 0, 0.55);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(ellipse at 20% -10%, var(--bg-deep) 0%, transparent 55%),
      radial-gradient(ellipse at 100% 110%, var(--bg-deep) 0%, transparent 50%),
      var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: flex;
    justify-content: center;
    padding: clamp(20px, 6vw, 64px) 16px 48px;
  }
  .page {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    align-items: center;
  }
  .eyebrow {
    display: flex; align-items: center; justify-content: center; gap: 7px;
    font-size: 12.5px; font-weight: 600; letter-spacing: 0.06em;
    color: var(--ink-soft); text-align: center;
  }
  .eyebrow .heart { color: var(--accent); font-size: 11px; }
  .card {
    width: 100%;
    background: var(--card);
    border-radius: 6px 6px 20px 20px;
    box-shadow: 0 24px 60px -20px var(--shadow), 0 2px 0 var(--card-deep) inset;
    overflow: hidden;
    clip-path: polygon(
      0% 3px, 4% 0%, 9% 4px, 15% 1px, 22% 5px, 29% 0%, 37% 3px, 45% 1px,
      53% 5px, 61% 0%, 68% 4px, 76% 1px, 84% 5px, 91% 0%, 96% 3px, 100% 1px,
      100% 100%, 0% 100%
    );
    transform: rotate(-0.4deg);
  }
  .frame img { display: block; width: 100%; height: auto; }
  .save-hint {
    padding: 16px clamp(20px, 6vw, 32px) 22px;
    text-align: center; font-size: 13px; line-height: 1.6;
    color: var(--ink-soft);
    border-top: 1px dashed var(--accent-soft);
    margin: 0 clamp(20px, 6vw, 32px);
  }
  .save-hint strong { color: var(--ink); font-weight: 600; }
  @media (prefers-reduced-motion: no-preference) {
    .card { animation: rise 0.6s ease-out; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px) rotate(-0.4deg); }
      to { opacity: 1; transform: translateY(0) rotate(-0.4deg); }
    }
  }
</style>
